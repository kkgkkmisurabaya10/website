<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pendaftaran Tryout TKA - KKG MI Surabaya</title>
    <style>
        html, body {
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100dvh; /* Menggunakan dvh agar pas di layar HP (tidak tertutup bar URL browser) */
            overflow: hidden; 
            background-color: #f4f7f4;
        }
        iframe {
            width: 100%; 
            height: 100%; 
            border: none; 
            display: block;
        }
    </style>
</head>
<body>

    <!-- Atribut sandbox dioptimalkan: allow-same-origin memastikan login sukses, allow-popups memastikan WA dan Download bisa terbuka -->
    <iframe 
        src="https://daftar-inky-rho.vercel.app/" 
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"
        title="Portal Tryout TKA KKGMI Surabaya 10"
        allowfullscreen>
    </iframe>

</body>
</html>
