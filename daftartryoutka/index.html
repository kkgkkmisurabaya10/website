<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Tryout TKA - KKG MI Surabaya</title>
    
    <!-- Meta tags untuk WhatsApp preview -->
    <meta property="og:title" content="Pendaftaran Tryout TKA CBT - KKG MI Surabaya">
    <meta property="og:description" content="Aplikasi Ujian Berbasis Komputer Resmi MIS Baiturrahman Gubeng">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1e3a8a; /* Warna biru gelap */
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        /* Animasi Loading Muter */
        .loader {
            border: 6px solid #ffffff33; /* Transparan */
            border-top: 6px solid #ffffff; /* Putih solid */
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    
    <div class="loader"></div>
    <h2>Memuat Aplikasi CBT...</h2>
    <p style="font-size: 14px; opacity: 0.8;">Mohon tunggu sebentar.</p>

    <script>
        // Mengalihkan secara otomatis dalam 1 detik (1000 milidetik)
        // Menggunakan "replace" agar pengunjung tidak bisa menekan tombol "Back" ke halaman ini
        setTimeout(function() {
            window.location.replace("https://daftar-wanto1.vercel.app/");
        }, 1000);
    </script>
</body>
</html>
